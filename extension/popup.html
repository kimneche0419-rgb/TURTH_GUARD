<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Truth History 가드</title>
  <style>
    body { width: 320px; margin: 0; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #ffffff; color: #000000; padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 2px 0; color: #000000; }
    .sub { color: #333333; font-size: 11px; margin: 0 0 14px 0; }
    label { display: block; font-size: 11px; color: #000000; margin: 10px 0 4px 0; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 7px; border: 1px solid #c4c4c4; background: #ffffff; color: #000000; font-size: 12px; outline: none; }
    input[type=text]:focus, input[type=password]:focus { border-color: #0f172a; }
    .row > label { font-size: 13px; font-weight: 600; color: #0f172a; }
    select { width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid #cbd5e1; background: #ffffff; color: #333333; font-size: 12px; outline: none; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .row span { font-size: 12px; color: #000000; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #ffffff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #0f172a; }
    input:checked + .slider:before { transform: translateX(18px); }
    button { margin-top: 14px; width: 100%; padding: 9px; border: 1px solid #0f172a; border-radius: 8px; background: #ffffff; color: #000000; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:hover { background: #f1f5f9; }
    #checkBackend { margin-top: 10px; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; background: #f8fafc; color: #000000; font-size: 12px; min-height: 20px; }
    .cred { font-size: 20px; font-weight: 800; color: #000000; }
    .ok { color: #16a34a; } .warn { color: #d97706; } .bad { color: #dc2626; }
    .muted { color: #555555; }
    .reasons { margin: 6px 0 0 0; padding-left: 16px; }
    .reasons li { margin: 2px 0; color: #000000; }
    .hint { color: #555555; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🛡️ Truth History 가드</h1>
  <p class="sub">LLM 역사 할루시네이션 실시간 교차 검증</p>

  <div class="row">
    <span>자동 스캔(지원 LLM 사이트)</span>
    <label class="switch"><input type="checkbox" id="autoScan" /><span class="slider"></span></label>
  </div>

  <label for="backendSelect">백엔드 모드</label>
  <select id="backendSelect">
    <option value="auto">자동 (로컬 우선)</option>
    <option value="local">로컬 백엔드 (localhost:8000)</option>
    <option value="cloud">클라우드 백엔드 (Vercel)</option>
    <option value="custom">사용자 설정</option>
  </select>
  <label id="customApiWrap" style="display:none;">사용자 백엔드 URL
    <input id="customApiInput" type="text" placeholder="http://localhost:8000" />
  </label>
  <button id="checkBackend">💻 가용 백엔드 상태 확인</button>

  <button id="save">설정 저장</button>

  <div class="status" id="status"><span class="muted">최근 검사 결과가 여기에 표시됩니다.</span></div>
  <p class="hint">지원 사이트에서 어시스턴트 답변에 배지가 자동 삽입되며, 텍스트를 선택해 우클릭하면 즉시 검증할 수 있습니다.</p>

  <script src="popup.js"></script>
</body>
</html>
